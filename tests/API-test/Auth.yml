info:
  name: Auth
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: BASE_URL
      value: ""
  body:
    type: json
    data: |-
      {
        "email": "tae@testing.com",
        "password" : "Tae@2026"
      }
  auth:
    type: basic

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status ===200 && res.body?.access_token ){
          bru.setEnvVar("tokenID", res.body.access_token)
          console.log ('token guardado en la variable de entorno "tokenID"')
        }
    - type: tests
      code: |-
        test ('validar codigo de resultado exitoso', function (){
          expect (res.status).to.equal(200)
        });

        test ('validar recepcion de token usando el body', function (){
          expect(res.body).to.have.property("access_token")
        });
  assertions:
    - expression: res.body
      operator: isJson
      description: datos del body es un JSON valido
    - expression: res.body.access_token
      operator: isString
      description: token proporcionado es un string
    - expression: res.status
      operator: eq
      value: "200"
      description: petición ha sido exitosa

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
